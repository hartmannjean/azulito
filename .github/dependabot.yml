version: 2
updates:
  # Cada workspace do monorepo tem seu próprio lockfile efetivo (via npm
  # workspaces) — o Dependabot entende workspaces e abre PRs por pacote.
  # Versões estão pinadas exatas de propósito (sem ^/~) em todo o projeto.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
